<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
<div class="site-wrapper">
  <header class="main-header">
    <div class="container nav-flex">
      <div class="logo"><a href="index.html">⨀ / meow</a></div>
      <nav class="navbar">
        <ul class="nav-links">
          <li><a href="index.html">Home</a></li>
          <li><a href="about.html">About</a></li>
          <li><a href="skills.html">Skills</a></li>
          <li><a href="interests.html">Interests</a></li>
          <li><a href="projects.html">Projects</a></li>
          <li><a href="contact.html" class="active">Contact</a></li>
        </ul>
      </nav>
      <div class="mobile-toggle" id="mobileToggle"><i class="fas fa-bars"></i></div>
    </div>
  </header>
  <main class="main-content">
    <div class="container">
      <h1 class="page-heading">Let's connect</h1>
      <div class="contact-form">
        <form action="#" method="post">
          <div class="form-group">
            <input type="text" placeholder="Your name" required>
          </div>
          <div class="form-group">
            <input type="email" placeholder="Email address" required>
          </div>
          <div class="form-group">
            <textarea placeholder="Your message..."></textarea>
          </div>
          <button type="submit" class="btn btn-primary">
            <i class="fas fa-paper-plane"></i> Send message
          </button>
        </form>
        <div class="contact-info-row">
          <i class="fas fa-envelope"></i>
          <span class="placeholder-text">insert text</span>
          <i class="fas fa-phone-alt" style="margin-left: 1rem"></i>
          <span class="placeholder-text">insert text</span>
        </div>
        <p class="placeholder-text" style="margin-top: 1.2rem">insert text.</p>
      </div>
    </div>
  </main>
  <footer class="main-footer">
    <div class="container footer-inner">
      <div class="footer-copy">
        <p>© 2025 meow</p>
      </div>
      <div class="footer-links">
        <a href="#"><i class="fab fa-github"></i></a>
        <a href="#"><i class="fab fa-linkedin-in"></i></a>
        <a href="#"><i class="fab fa-twitter"></i></a>
      </div>
    </div>
  </footer>
</div>
<script>
  const toggleBtn = document.getElementById('mobileToggle');
  const navLinks = document.querySelector('.nav-links');
  if (toggleBtn) {
    toggleBtn.addEventListener('click', () => {
      navLinks.classList.toggle('show');
    });
  }
</script>
</body>
</html>
